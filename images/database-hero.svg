<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb" />
      <stop offset="100%" style="stop-color:#1d4ed8" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)" rx="20"/>
  
  <!-- Database cylinders -->
  <g transform="translate(250, 100)" filter="url(#shadow)">
    <!-- Back cylinder -->
    <ellipse cx="100" cy="60" rx="80" ry="25" fill="#93c5fd"/>
    <rect x="20" y="60" width="160" height="120" fill="#60a5fa"/>
    <ellipse cx="100" cy="180" rx="80" ry="25" fill="#3b82f6"/>
    
    <!-- Middle cylinder -->
    <ellipse cx="100" cy="40" rx="80" ry="25" fill="#bfdbfe"/>
    <rect x="20" y="40" width="160" height="120" fill="#93c5fa"/>
    <ellipse cx="100" cy="160" rx="80" ry="25" fill="#60a5f6"/>
    
    <!-- Front cylinder -->
    <ellipse cx="100" cy="20" rx="80" ry="25" fill="url(#dbGradient)"/>
    <rect x="20" y="20" width="160" height="120" fill="#2563eb"/>
    <ellipse cx="100" cy="140" rx="80" ry="25" fill="#1d4ed8"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="#7c3aed" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 450 150 Q 500 100 550 150" />
    <path d="M 450 200 Q 500 250 550 200" />
    <path d="M 450 175 L 550 175" />
  </g>
  
  <!-- Server icons -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="60" height="80" fill="#7c3aed" rx="8"/>
    <rect x="10" y="15" width="40" height="4" fill="#ddd" rx="2"/>
    <rect x="10" y="25" width="40" height="4" fill="#ddd" rx="2"/>
    <rect x="10" y="35" width="40" height="4" fill="#ddd" rx="2"/>
    <circle cx="50" cy="50" r="3" fill="#10b981"/>
    <rect x="10" y="55" width="40" height="4" fill="#ddd" rx="2"/>
    <circle cx="50" cy="65" r="3" fill="#10b981"/>
  </g>
  
  <!-- Data flow circles -->
  <g fill="#06b6d4" opacity="0.8">
    <circle cx="380" cy="120" r="6">
      <animate attributeName="cy" values="120;140;120" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="160" r="6">
      <animate attributeName="cy" values="160;180;160" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="200" r="6">
      <animate attributeName="cy" values="200;220;200" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Text -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2937">Базы Данных</text>
  <text x="400" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">SQL • NoSQL • Оптимизация</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="30" fill="#2563eb" opacity="0.1"/>
  <circle cx="700" cy="320" r="40" fill="#7c3aed" opacity="0.1"/>
  <circle cx="650" cy="60" r="20" fill="#06b6d4" opacity="0.15"/>
</svg>
